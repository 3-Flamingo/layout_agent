<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>布局标注</title>
<style>
  body { background:#16181c; color:#e8e8e8; font-family:"Segoe UI",sans-serif; margin:0; }
  header { display:flex; gap:16px; align-items:center; padding:10px 16px; background:#1f2228; position:sticky; top:0; }
  header input { background:#2a2e36; color:#e8e8e8; border:1px solid #444; border-radius:4px; padding:4px 8px; }
  button { background:#2a2e36; color:#e8e8e8; border:1px solid #555; border-radius:4px; padding:6px 12px; cursor:pointer; }
  button:hover { background:#3a3f4a; }
  button.primary { background:#2d5be3; border-color:#2d5be3; }
  button.sel { background:#2d8a4e; border-color:#2d8a4e; }
  #imgs { display:flex; gap:10px; justify-content:center; padding:12px; }
  #imgs figure { margin:0; text-align:center; flex:1; max-width:48%; }
  #imgs.single figure { max-width:90%; }
  #imgs img { width:100%; border:1px solid #333; border-radius:4px; background:#000; }
  #panel { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:8px 16px 24px; align-items:center; }
  .problems label { margin-right:10px; font-size:13px; user-select:none; }
  #comment { width:340px; }
  .hint { color:#888; font-size:12px; }
  figcaption { color:#aaa; padding:4px; font-size:13px; }
</style>
</head>
<body>
<header>
  <b>布局标注</b>
  <label>标注人 <input id="annotator" placeholder="姓名/工号" size="10"></label>
  <span id="progress"></span>
  <button id="prev">上一条</button>
  <button id="next">下一条</button>
  <button id="export" class="primary">导出标注 (.jsonl)</button>
  <span class="hint" id="hint"></span>
</header>
<div id="imgs"></div>
<div id="panel"></div>
<script src="tasks.js"></script>
<script>
const TASKS = window.TASKS || [];
const DSID = window.DATASET_ID || "default";
const PROBLEMS = [
  ["text_overlap","文字重叠"],["text_cross_line","文字穿线"],["out_of_frame","出框"],
  ["text_in_part","文字进零件"],["layer_disorder","分层乱序"],["leader_too_long","引线过长"],
  ["overcrowd","某侧过密"],["unbalanced","分布不均"]
];
let idx = 0;
let labels = JSON.parse(localStorage.getItem("labels_"+DSID) || "{}");
document.getElementById("annotator").value = localStorage.getItem("annotator_"+DSID) || "";

function save(){ localStorage.setItem("labels_"+DSID, JSON.stringify(labels));
  localStorage.setItem("annotator_"+DSID, document.getElementById("annotator").value); render(); }

function render(){
  const t = TASKS[idx];
  if (!t){ document.getElementById("imgs").innerHTML = "<p style='padding:40px'>没有任务</p>"; return; }
  const done = Object.keys(labels).length;
  document.getElementById("progress").textContent = `第 ${idx+1}/${TASKS.length} 条 · 已标 ${done}`;
  const lab = labels[t.id] || {};
  const imgs = document.getElementById("imgs");
  const panel = document.getElementById("panel");
  if (t.type === "prefer"){
    document.getElementById("hint").textContent = "快捷键: ← 选A · → 选B · T 差不多";
    imgs.className = "";
    imgs.innerHTML = `
      <figure><img src="${t.render_a}"><figcaption>A</figcaption></figure>
      <figure><img src="${t.render_b}"><figcaption>B</figcaption></figure>`;
    panel.innerHTML = `
      <button id="pa" class="${lab.prefer==='a'?'sel':''}">A 更好 (←)</button>
      <button id="pt" class="${lab.prefer==='tie'?'sel':''}">差不多 (T)</button>
      <button id="pb" class="${lab.prefer==='b'?'sel':''}">B 更好 (→)</button>`;
    const set = v => { labels[t.id] = {prefer:v}; save(); go(1); };
    pa.onclick = ()=>set("a"); pb.onclick = ()=>set("b"); pt.onclick = ()=>set("tie");
  } else {
    document.getElementById("hint").textContent = "快捷键: 1–5 打分（5=可直接出图, 1=不可用）";
    imgs.className = "single";
    imgs.innerHTML = `<figure><img src="${t.render}"></figure>`;
    let btns = "";
    for (let g=1; g<=5; g++)
      btns += `<button data-g="${g}" class="${lab.grade===g?'sel':''}">${g}</button>`;
    let probs = PROBLEMS.map(([k,zh]) =>
      `<label><input type="checkbox" data-p="${k}" ${(lab.problems||[]).includes(k)?'checked':''}>${zh}</label>`).join("");
    panel.innerHTML = `等级：${btns} <span class="problems">${probs}</span>
      <input id="comment" placeholder="备注(可选)" value="${lab.comment||''}">`;
    panel.querySelectorAll("button[data-g]").forEach(b => b.onclick = () => {
      labels[t.id] = collect(parseInt(b.dataset.g)); save(); go(1);
    });
    panel.querySelectorAll("input[data-p]").forEach(c => c.onchange = () => {
      labels[t.id] = collect((labels[t.id]||{}).grade); save();
    });
    document.getElementById("comment").onchange = e => {
      labels[t.id] = collect((labels[t.id]||{}).grade); save();
    };
    function collect(g){
      const probs = [...panel.querySelectorAll("input[data-p]:checked")].map(c=>c.dataset.p);
      return {grade: g, problems: probs, comment: document.getElementById("comment").value};
    }
  }
}
function go(d){ idx = Math.min(Math.max(idx+d,0), TASKS.length-1); render(); }
document.getElementById("prev").onclick = ()=>go(-1);
document.getElementById("next").onclick = ()=>go(1);
document.addEventListener("keydown", e => {
  const t = TASKS[idx]; if (!t) return;
  if (e.target.tagName === "INPUT" && e.target.type === "text") return;
  if (t.type === "prefer"){
    if (e.key === "ArrowLeft"){ labels[t.id]={prefer:"a"}; save(); go(1); }
    if (e.key === "ArrowRight"){ labels[t.id]={prefer:"b"}; save(); go(1); }
    if (e.key.toLowerCase() === "t"){ labels[t.id]={prefer:"tie"}; save(); go(1); }
  } else if (["1","2","3","4","5"].includes(e.key)){
    const prev = labels[t.id]||{};
    labels[t.id] = {grade:parseInt(e.key), problems:prev.problems||[], comment:prev.comment||""};
    save(); go(1);
  }
});
document.getElementById("export").onclick = () => {
  const who = document.getElementById("annotator").value || "unknown";
  const now = new Date().toISOString().slice(0,10);
  const lines = TASKS.filter(t => labels[t.id]).map(t => {
    const lab = {...labels[t.id], annotator: who, annotated_at: now};
    if (t.type === "prefer")
      return JSON.stringify({pair_id:t.id, view_key:t.view_key, state_a:t.state_a, state_b:t.state_b, label:lab});
    return JSON.stringify({sample_id:t.id, state:t.state, label:lab});
  });
  const blob = new Blob([lines.join("\n")+"\n"], {type:"application/jsonl"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `labels_${DSID}_${who}_${now}.jsonl`;
  a.click();
};
render();
</script>
</body>
</html>
